name: Version bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (e.g. 1.0.4)"
        required: true

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "npm"

      - run: npm ci

      - name: Bump manifest.json, versions.json and package.json
        env:
          npm_package_version: ${{ inputs.version }}
        run: |
          node version-bump.mjs
          npm pkg set version="${npm_package_version}"
          npm install --package-lock-only

      # The version input goes through env, never ${{ }} inside run: (template injection).
      - name: Commit and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json manifest.json versions.json
          git commit -m "Release $VERSION"
          git tag "$VERSION"
          git push origin HEAD:main
          git push origin "$VERSION"

      - name: Trigger release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh workflow run release.yml --ref "$VERSION"
