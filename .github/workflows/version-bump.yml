name: Version bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (e.g. 1.0.4)"
        required: true

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "npm"

      - run: npm ci

      - name: Bump manifest.json, versions.json and package.json
        env:
          npm_package_version: ${{ inputs.version }}
        run: |
          node version-bump.mjs
          npm pkg set version="${npm_package_version}"
          npm install --package-lock-only

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json manifest.json versions.json
          git commit -m "Release ${{ inputs.version }}"
          git tag "${{ inputs.version }}"
          git push origin HEAD:main
          git push origin "${{ inputs.version }}"

      - name: Trigger release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "${{ inputs.version }}"
